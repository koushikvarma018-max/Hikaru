<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikaru's Space</title>
<meta name="description" content="A quiet corner of the universe — drift away from the noise of the world.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='54' cy='50' r='36' fill='%23f2ecd8'/><circle cx='40' cy='42' r='32' fill='%23070b18'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>

<!-- Opening: the welcome text fades in, holds, fades out, then the world appears -->
<div id="intro">
  <p id="intro-text">Welcome to Hikaru&rsquo;s Space</p>
</div>

<header id="site-header" class="ui-fade">
  <h1>Hikaru&rsquo;s Space</h1>
  <p id="scene-label">Moonlit Lake</p>
</header>

<p id="whisper" aria-live="polite"></p>
<p id="sound-hint" class="ui-fade">touch anywhere &mdash; let the music flow</p>

<div id="controls" class="ui-fade">
  <div id="ctl-left">
    <button id="mute" class="ctl-btn" aria-label="Toggle sound" title="Sound on / off">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="icon-on">
          <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/>
          <path d="M15.5 9.2a4 4 0 0 1 0 5.6"/>
          <path d="M17.8 6.8a7 7 0 0 1 0 10.4"/>
        </g>
        <g class="icon-off">
          <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/>
          <path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/>
        </g>
      </svg>
    </button>
    <button id="breath-btn" class="ctl-btn" aria-label="Breathing exercise" title="Breathe (B)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.5 8.5h9.2a2.6 2.6 0 1 0-2.6-2.6"/>
        <path d="M3.5 12.5h14.2a2.8 2.8 0 1 1-2.8 2.8"/>
        <path d="M3.5 16.5h7.2"/>
      </svg>
    </button>
  </div>
  <div id="scene-picker" role="tablist" aria-label="Choose a scene"></div>
</div>

<!-- signature watermark -->
<footer id="watermark" class="ui-fade">
  <p class="wm-line">made by team hikaru, with love</p>
  <p class="wm-sub">creator &mdash; t.&nbsp;koushik</p>
</footer>

<!-- guided breathing -->
<div id="breathe" aria-hidden="true">
  <div class="breath-stage"><div id="breath-orb"></div></div>
  <p id="breath-phase"></p>
  <p id="breath-meta"></p>
  <button id="breath-exit">return to the world</button>
</div>

<script src="script.js"></script>
</body>
</html>
